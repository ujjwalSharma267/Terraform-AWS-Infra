AWSTemplateFormatVersion: "2010-09-09"
Description: Supplementary CloudFormation stack - reporting/log export bucket, managed independently of the main Terraform stack

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  ReportingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-infra-reports-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            ExpirationInDays: 90

Outputs:
  ReportingBucketName:
    Description: Name of the reporting bucket
    Value: !Ref ReportingBucket
